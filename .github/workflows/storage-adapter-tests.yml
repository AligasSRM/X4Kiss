name: Storage Adapter Tests

on:
  push:
    branches: [main]
    paths:
      - "storage/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storage-adapter-tests.yml"
      - "worker.js"
      - "wrangler.toml"
      - "admin/**"
      - "security/**"
      - "settings/**"
  pull_request:
    paths:
      - "storage/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storage-adapter-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run automated tests
        run: npm test
