name: Deploy XKiss Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "security/**"
      - "settings/**"
      - "views-revenue/**"
      - "wallet/**"
      - "safety/**"
      - "admin/**"
      - "wrangler.toml"
      - ".github/workflows/xkiss-worker-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Worker with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "07fd4c469a3a7c0c5e0f3047304b880e"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing; Worker deployment was not attempted."
            exit 1
          fi
          npx --yes wrangler@4 deploy
