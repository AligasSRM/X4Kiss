name: XKiss ElasticLake Storage Verification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/xkiss-elasticlake-storage-verification.yml"
      - "storage-setup/ELASTICLAKE-GITHUB-SETUP.md"
      - "storage/elasticlake-adapter.js"
      - "storage/xkiss-storage-production-gate.js"
      - "storage/xkiss-storage-production-gate-self-test.js"
      - "security/xkiss-secret-management-monitor.js"
      - "audit/PRODUCTION-READINESS-REVIEW.md"

permissions:
  contents: read

concurrency:
  group: xkiss-elasticlake-storage-verification
  cancel-in-progress: false

jobs:
  elasticlake-write-read-delete:
    name: Live ElasticLake write-read-delete through production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run live storage integration test
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 30 \
            "https://xkiss.srourr-ali73.workers.dev/api/views/storage/self-test")"
          printf '%s\n' "$response"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, "Worker storage self-test returned ok=false"; assert d.get("verified") is True, "ElasticLake write/read/delete verification failed"; assert d.get("cleanup",{}).get("ok") is True, "ElasticLake cleanup failed"; print("PASS: Production Worker completed real ElasticLake write, read-back, and delete.")' <<< "$response"
