name: X4Kiss Repository-Wide Audit

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: x4kiss-repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-tests:
    name: Syntax, imports, JSON and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check syntax of every tracked JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.js' '*.mjs' '*.cjs' | xargs -0 -r -n1 node --check

      - name: Validate tracked JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(git ls-files -z -- '*.json')

      - name: Check relative JavaScript imports resolve
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { execFileSync } from "node:child_process";

          const files = execFileSync("git", ["ls-files", "-z"], { encoding: "utf8" })
            .split("\0").filter(Boolean);
          const sourceFiles = files.filter((f) => /\.(?:js|mjs|cjs)$/.test(f));
          const missing = [];
          const specifierPattern = /(?:\bfrom\s*|\bimport\s*\(|\brequire\s*\()\s*["'](\.{1,2}\/[^"']+)["']/g;

          for (const file of sourceFiles) {
            const source = fs.readFileSync(file, "utf8");
            for (const match of source.matchAll(specifierPattern)) {
              const specifier = match[1];
              const base = path.resolve(path.dirname(file), specifier);
              const candidates = [
                base, base + ".js", base + ".mjs", base + ".cjs",
                base + ".json", base + ".html", base + ".css",
                path.join(base, "index.js"), path.join(base, "index.mjs"),
                path.join(base, "index.cjs")
              ];
              if (!candidates.some((candidate) => {
                try { return fs.statSync(candidate).isFile(); } catch { return false; }
              })) missing.push(`${file}: ${specifier}`);
            }
          }

          if (missing.length) {
            console.error("Unresolved relative imports:");
            for (const item of missing) console.error(" - " + item);
            process.exit(1);
          }
          console.log(`Relative import check passed for ${sourceFiles.length} tracked JS files.`);
          NODE

      - name: Install declared dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run repository test suite
        run: npm test

      - name: Check dependency advisories
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret and credential scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL JavaScript security analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@v3
