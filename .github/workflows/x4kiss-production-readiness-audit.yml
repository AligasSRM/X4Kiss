name: X4Kiss Production Readiness Audit

on:
  push:
    paths:
      - "core/xkiss-production-readiness-*.js"
      - "activation/xkiss-section-19-*.js"
      - "activation/xkiss-production-activation-readiness-*.js"
      - "audit/PRODUCTION-READINESS-REVIEW.md"
      - ".github/workflows/x4kiss-production-readiness-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production readiness gate
        run: |
          node --input-type=module <<'NODE'
          import { getXKissProductionReadiness, validateXKissProductionReadiness } from "./core/xkiss-production-readiness-core.js";
          import { runXKissProductionReadinessSelfTest } from "./core/xkiss-production-readiness-self-test.js";
          import { runSection19SelfTest } from "./activation/xkiss-production-activation-readiness-self-test.js";
          import { runSection19Regression } from "./activation/xkiss-section-19-regression.js";

          const status = getXKissProductionReadiness();
          const validation = validateXKissProductionReadiness();
          const selfTest = runXKissProductionReadinessSelfTest();
          const section19 = runSection19SelfTest();
          const section19Regression = runSection19Regression();

          const result = {
            status,
            validation,
            selfTest,
            section19,
            section19Regression,
            auditPassed:
              validation.ok === true &&
              selfTest.ok === true &&
              section19.ok === true &&
              section19Regression.ok === true &&
              status.productionActivationAllowed === false
          };

          console.log(JSON.stringify(result, null, 2));

          if (!result.auditPassed) process.exit(1);
          NODE
