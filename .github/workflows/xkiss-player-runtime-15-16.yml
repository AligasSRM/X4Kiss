name: XKiss Player Runtime 15.16

on:
  push:
    paths:
      - "index.html"
      - "player.html"
      - "js/player.js"
      - "js/video-data.js"
      - "js/player/*.js"
      - "home/*.js"
      - "player/runtime/*.js"
      - ".github/workflows/xkiss-player-runtime-15-16.yml"
      - ".github/workflows/xkiss-final-review.yml"
  workflow_dispatch:

jobs:
  player-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run 15.16 core self-test
        run: |
          node --input-type=module <<'NODE'
          import { runXKissPlayerRuntimeIntegrationSelfCheck } from "./player/runtime/player-runtime-integration-self-test.js";
          import { validateXKissPlayerRuntimeIntegration, evaluateXKissPlayerRuntimeIntegrationRequest } from "./player/runtime/player-runtime-integration-integration.js";

          const selfTest = runXKissPlayerRuntimeIntegrationSelfCheck();
          const integration = validateXKissPlayerRuntimeIntegration();
          const valid = evaluateXKissPlayerRuntimeIntegrationRequest({
            operation: "validate_video_runtime",
            homepageVerified: true,
            playerPageVerified: true,
            playerCoreConnected: true,
            modulesConnected: true,
            qualitiesVerified: true,
            videoRuntimeVerified: true
          });

          const result = {
            stage_15_16: { selfTest, integration, valid },
            allPassed: selfTest.ok === true && integration.ok === true && valid.allowed === true
          };

          console.log(JSON.stringify(result, null, 2));
          if (!result.allPassed) process.exit(1);
          NODE

      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          npx playwright install chrome

      - name: Start local XKiss server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/xkiss-http.log 2>&1 &
          sleep 2

      - name: Diagnose MP4 asset
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ls -lh 20260923_234200-3.mp4
          file 20260923_234200-3.mp4 || true
          ffprobe -v error -show_entries format=format_name,duration,size -show_entries stream=codec_name,codec_type,width,height,pix_fmt,profile,level,codec_tag_string,codec_long_name,sample_rate,channels -of json 20260923_234200-3.mp4
          curl -sS -D /tmp/xkiss-mp4-headers.txt -o /tmp/xkiss-mp4.bin http://127.0.0.1:4173/20260923_234200-3.mp4 || true
          cat /tmp/xkiss-mp4-headers.txt || true
          ls -lh /tmp/xkiss-mp4.bin || true

      - name: Real Home and Player access-gate browser test
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ channel: "chrome", headless: true });
          const page = await browser.newPage();
          const errors = [];
          page.on("pageerror", error => errors.push(String(error)));
          page.on("console", message => {
            if (message.type() === "error") errors.push(message.text());
          });

          await page.goto("http://127.0.0.1:4173/index.html", { waitUntil: "networkidle" });

          if (await page.title() !== "XKiss — Home") throw new Error("Home title failed");
          if (!(await page.locator(".hero").count())) throw new Error("Home hero missing");
          if ((await page.locator(".video-card").count()) !== 0) throw new Error("Unpublished/test video leaked onto home page");
          if (!(await page.locator("#home-videos-empty").isVisible())) throw new Error("Published-video empty state missing");
          if (!(await page.locator("#home-categories-empty").isVisible())) throw new Error("Category empty state missing");
          if (!(await page.locator("#home-creators-empty").isVisible())) throw new Error("Verified-creator empty state missing");
          if ((await page.locator("#featured.show").count()) !== 0) throw new Error("Featured section shown without published featured content");

          await page.locator("#home-search-input").fill("sample");
          await page.locator(".home-search button").click();
          await page.waitForURL(/videos\.html\?q=sample/);
          if (!new URL(page.url()).searchParams.has("q")) throw new Error("Search query was not preserved");
          
          await page.goto("http://127.0.0.1:4173/player.html?id=video-001", { waitUntil: "networkidle" });
          await page.waitForURL(/register\.html\?next=/);
          if (!new URL(page.url()).searchParams.has("next")) throw new Error("Protected player route did not preserve return path");
          if (await page.locator("#player").count()) throw new Error("Player content leaked before authentication");

          const unexpectedErrors = errors.filter(error =>
            !error.includes("Failed to fetch") &&
            !error.includes("ERR_FAILED") &&
            !error.includes("Failed to load resource: the server responded with a status of 404")
          );
          if (unexpectedErrors.length) throw new Error("Unexpected browser errors: " + unexpectedErrors.join(" | "));

          console.log(JSON.stringify({
            home: "PASS",
            homePublishedContentSafety: "PASS",
            searchNavigation: "PASS",
            unauthenticatedPlayerAccessDenied: "PASS",
            returnPathPreserved: "PASS"
          }, null, 2));

          await browser.close();
          NODE
